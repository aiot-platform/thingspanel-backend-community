name: Docker Image Build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing published release tag
        required: true
  push:
    branches:
      - dev
permissions:
  contents: write
  packages: write
env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: backend
            image: thingspanel-go
            dockerfile: Dockerfile
          - component: broker
            image: thingspanel-mosquitto
            dockerfile: deploy/mosquitto-community/Dockerfile.production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release source
        if: github.event_name != 'push'
        env:
          REQUESTED_TAG: ${{ inputs.version }}
        run: python3 deploy/release/release.py select-tag --version "$REQUESTED_TAG"
      - name: Set build version for branch push
        if: github.event_name == 'push'
        run: echo "VERSION=v1.3.0" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.ACR }}/${{ matrix.image }}:${{ env.VERSION }}
      - name: Record verified registry manifests
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
        run: |
          python3 deploy/release/release.py record-image --version "$VERSION" --component "$COMPONENT" --image "$IMAGE"
          gh release upload "$VERSION" "release-records/$COMPONENT-image.json" --clobber
