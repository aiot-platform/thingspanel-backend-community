# ThingsPanel 1.2-release 分支镜像构建
#
# 只构建并推送到自有阿里云 ACR（peak-aiot 命名空间），不再推送 DockerHub / ghcr.io。
# 触发：推送 1.2-release 分支，或在 Actions 页面手动触发。
name: Docker Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.2-release

permissions:
  contents: read

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot
  VERSION: v1.2.12.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 登录自有 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送到自有 ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.ACR }}/thingspanel-go:${{ env.VERSION }}
